    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
        <link rel="stylesheet" href="/CSS/cadastro.CSS">
        <title>Cadastro</title>
    </head>
    <script src="/JS/cadastro.js"></script>
    <body>

        <div class="bars-bg">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <div class="container">
            <h1>Cadastro</h1>

            <div class="input-box">
                <input type="text" placeholder="Usuário" id="Usuario">
                <i class="bx bx-user"></i>
            </div>

            <div class="input-box">
                <input type="email" placeholder="E-mail" id="EMAIL">
                <i class="bx bx-envelope"></i>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Senha" id="Senha">
                <i class="bx bx-lock-alt"></i>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Confirmar senha" id="Confirmar_senha">
                <i class="bx bx-lock-alt"></i>
            </div>

            <button type="button" onclick="cadastrar()">Cadastrar</button>

            <p class="footer-text">Já tem uma conta? <a href="tela_de_login.html">Entrar</a></p>
        </div>

    </body>
    </html>
