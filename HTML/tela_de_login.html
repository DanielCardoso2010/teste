<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="favicon" href="IMG/icons8-favicon (2).gif">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/login.css">
    <title>Tela de Login</title>
</head> 
<body>  

    <div class="bars-bg">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <main class="container">
        <h1>Login</h1>

        <div class="input-box">
            <input placeholder="E-mail" type="email" id="EMAIL">
            <i class="bx bx-user"></i>
        </div>

        <div class="input-box">
            <input placeholder="Senha" type="password" id="pswd">
            <i class="bx bx-lock-alt"></i>
        </div>

        <p id="erro"></p>

        <div class="remember-forgot">
            <label>
                <input type="checkbox">
                lembrar minha senha
            </label>
            <a href="recuperar_senha.html">Esqueci minha senha</a>
        </div>

        <button type="button" onclick="login()" id="botao">Login</button>
        <div class="register-link">
            <p>Não tem uma conta? <a href="tela_de_cadastro.html">Cadastre-se</a></p>
        </div>
    </main>

    <script src="/JS/login.js"></script>
</body>
</html>
